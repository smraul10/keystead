# Checks that run before every commit. Skip in an emergency with: git commit --no-verify
# Plain output: the interactive spinner hangs in the classic Windows console
no_tty: true
colors: false
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,css,md,yml,yaml,html}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx,js}'
      run: pnpm eslint {staged_files}
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm typecheck
    test:
      glob: '*.{ts,tsx}'
      run: pnpm test
    rust-format:
      glob: '*.rs'
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
