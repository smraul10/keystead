[package]
name = "keystead"
version = "0.1.0"
description = "Local-first desktop password manager"
authors = ["smraul10"]
repository = "https://github.com/smraul10/keystead"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The app and the crates it is made of, built together
[workspace]
members = ["crates/vault", "crates/os-events"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keystead_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keystead-vault = { path = "crates/vault" }
zeroize = "1.9.1"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
url = "2.5.8"
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

# Locking at once when Windows locks the session or goes to sleep
[target.'cfg(windows)'.dependencies]
keystead-os-events = { path = "crates/os-events" }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# A panic in a command would take the whole app down: return errors instead
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"


# Argon2 is about 10 times slower without optimizations: optimize it (and the
# hash it uses) in dev and test builds too, so tests and `tauri dev` stay fast
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
