[package]
name = "keystead-os-events"
version = "0.1.0"
description = "Events from the operating system that should lock the vault"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Only the Windows glue (win32.rs) may use unsafe, and it says so explicitly
unsafe_code = "deny"

[lints.clippy]
# Every unsafe block explains why it is sound
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
