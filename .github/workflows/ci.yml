name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    # Fail instead of waiting for hours if something gets stuck
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  rust:
    name: Rust format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The runner comes with rustup: install the stable toolchain explicitly
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # Formatting doesn't compile anything, so it can check the whole workspace
      - name: Check formatting
        run: cargo fmt --all --check

      # Only the vault crate here, so its results come in seconds: the Tauri
      # app needs system libraries and has its own job below
      - name: Lint
        run: cargo clippy -p keystead-vault --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p keystead-vault --locked

  rust-app:
    name: Rust app lint and test
    runs-on: ubuntu-latest
    # Without caches, compiling Tauri takes minutes and downloading the system
    # libraries from a slow mirror has taken up to 30
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Ubuntu's mirrors are sometimes very slow (once 30 minutes for 40 MB):
      # keep the downloaded packages in GitHub's cache instead. Bump the
      # version in the key when the list of packages changes
      - name: Restore system packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-tauri-v1

      # What Tauri needs to compile on Linux (WebKitGTK and friends), without
      # the "recommended" extras. Packages already in the cache aren't downloaded
      - name: Install system libraries
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
          # apt runs as root: give the files back, so the cache can save them
          sudo chown -R "$USER" ~/apt-archives

      # Saved right away instead of at the end of the job (which only happens
      # if the job passes): a slow download is never lost to a failing test
      - name: Save system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      # Compiling Tauri from scratch takes minutes: reuse the last build
      - name: Cache the Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-app-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-app-${{ runner.os }}-

      # The app embeds the built frontend when it compiles: an empty page is
      # enough to check the Rust code
      - name: Placeholder frontend
        run: mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html

      - name: Lint
        run: cargo clippy -p keystead --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p keystead --locked
